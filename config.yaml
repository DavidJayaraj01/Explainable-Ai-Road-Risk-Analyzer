seed: 42
project_name: "xai-road-risk"

paths:
  raw_data_dir: "data/raw"
  interim_data_dir: "data/interim"
  processed_data_dir: "data/processed"
  results_metrics_dir: "results/metrics"
  results_shap_dir: "results/shap"
  results_pdp_ale_dir: "results/pdp_ale"
  results_stability_dir: "results/stability"
  results_tables_dir: "results/tables"
  figures_dir: "figures"
  report_dir: "report"

data:
  years: [2019, 2020, 2021, 2022, 2023, 2024]
  covid_years: [2020, 2021]
  stats19_base_url: "https://data.dft.gov.uk/road-accidents-safety-data"
  aadf_url: "https://storage.googleapis.com/dft-statistics/road-traffic/downloads/aadf/dft_aadf_uk.csv"
  open_meteo_url: "https://archive-api.open-meteo.com/v1/archive"
  sample_frac: 0.08  # Balanced sample fraction (~32k accidents, ~160k Task A rows)
  spatial_join_max_distance_km: 2.0
  control_to_case_ratio: 4
  control_rejection_radius_m: 500
  control_rejection_window_hours: 1

splits:
  train_end_year: 2022
  val_year: 2023
  test_year: 2024

regimes:
  weather:
    priority_order: ["snow_ice", "fog", "rain", "high_wind", "clear"]
    thresholds:
      rain_precip_mm: 0.5
      snow_snowfall_cm: 0.01
      freezing_temp_c: 0.0
      fog_rh_min: 95.0
      fog_dew_dep_max: 1.0
      fog_wind_max: 10.0
      high_wind_gust_kmh: 40.0
    min_test_samples: 2000
  traffic:
    tertiles: ["low", "medium", "high"]
    peak_hours_weekday: [7, 8, 9, 16, 17, 18]
  light:
    categories: ["day", "night_twilight"]

models:
  random_forest:
    n_estimators: 150
    max_depth: 12
    n_jobs: -1
    random_state: 42
  xgboost:
    n_estimators: 150
    max_depth: 6
    learning_rate: 0.08
    tree_method: "hist"
    n_jobs: -1
    random_state: 42

explainability:
  shap_max_samples: 15000
  background_samples: 1000
  bootstrap_replicates: 30
  permutation_replicates: 1000
  alpha_significance: 0.05
  top_k_features: 8
